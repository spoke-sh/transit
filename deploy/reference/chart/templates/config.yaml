{{- define "transit.configMap" -}}
{{- $component := .component }}
{{- $ := .root }}
{{- with $ }}
{{- $settings := index $.Values $component }}
{{- if and $settings.enabled (not (and (eq $component "ursula") $settings.existingConfigSecret)) }}
{{- $ctx := dict "root" $ "component" $component }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "transit.name" $ctx }}
  labels:
    {{- include "transit.labels" $ctx | nindent 4 }}
data:
  {{ if eq $component "ursula" }}ursula.toml{{ else }}config.json{{ end }}: |
    {{- include "transit.config" $ctx | nindent 4 }}
  {{- if and (eq $component "node") $.Values.node.table }}
  table.json: |
    {{- $.Values.node.table | toJson | nindent 4 }}
  {{- end }}
  {{- if eq $component "controller" }}
  egress.json: {{ dict "rules" (list (dict "hostnames" (dict "patterns" (list $settings.config.provider.authority_host)))) | toJson | quote }}
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /provider/ca.crt
    users:
      - name: controller
        user: {tokenFile: /provider/kube-token}
    contexts:
      - name: controller
        context: {cluster: cluster, user: controller}
    current-context: controller
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.board.enabled (not .Values.node.enabled) }}
{{- fail "board requires node.enabled in this chart" }}
{{- end }}
{{- range $component := list "node" "ursula" "board" "controller" }}
{{ include "transit.configMap" (dict "root" $ "component" $component) }}
{{- end }}
