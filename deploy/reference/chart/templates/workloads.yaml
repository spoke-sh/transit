{{- define "transit.workload" -}}
{{- $component := .component }}
{{- $ := .root }}
{{- with $ }}
{{- $settings := index $.Values $component }}
{{- if $settings.enabled }}
{{- $ctx := dict "root" $ "component" $component }}
{{- $configComponent := $component }}
{{- $configCtx := dict "root" $ "component" $configComponent }}
{{- $runtime := $settings }}
{{- $resources := $settings.resources }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "transit.name" $ctx }}
  labels:
    {{- include "transit.labels" $ctx | nindent 4 }}
spec:
  # One server owns authority, maintenance and delivery; workers remain external.
  replicas: {{ ternary 1 0 $.Values.running }}
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "transit.labels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "transit.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include "transit.config" $configCtx | sha256sum }}
        {{- if eq $component "node" }}
        checksum/table: {{ $.Values.node.table | toJson | sha256sum }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- if eq $component "controller" }}
      serviceAccountName: {{ include "transit.name" $ctx }}
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- if and (eq $component "board") $settings.extraInitContainers }}
      initContainers:
        {{- toYaml $settings.extraInitContainers | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "transit.name" $ctx }}
          image: {{ required (printf "%s image is required" $component) $runtime.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            {{- if eq $component "ursula" }}
            - server
            - --config
            - /config/ursula.toml
            {{- else }}
            {{- if eq $component "node" }}
            - server
            - --no-ui
            - --config
            {{- end }}
            - /config/config.json
            {{- end }}
          env:
            {{- if eq $component "ursula" }}
            - {name: RUST_LOG, value: warn}
            - {name: TOKIO_WORKER_THREADS, value: "2"}
            {{- else }}
            {{- $logging := $settings.logging }}
            - {name: LOG_FORMAT, value: {{ $logging.format | quote }}}
            - {name: LOG_LEVEL, value: {{ $logging.level | quote }}}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml $resources | nindent 12 }}
          {{- if has $component (list "node" "ursula" "board") }}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet:
              path: {{ if eq $component "ursula" }}/__ursula/ready{{ else }}/health{{ end }}
              port: http
              {{- if eq $component "board" }}
              httpHeaders:
                - name: Host
                  value: {{ regexReplaceAll "^https?://" $settings.config.public_origin "" | quote }}
              {{- end }}
            periodSeconds: 2
          {{- else if eq $component "controller" }}
          readinessProbe:
            exec:
              command: [/bin/transit-runtime-controller, /config/config.json, --check]
            periodSeconds: 15
            timeoutSeconds: 35
          {{- end }}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            {{- if eq $component "node" }}
            - {name: native-data, mountPath: /data}
            {{- end }}
            {{- if and (eq $component "node") $.Values.node.existingSecret }}
            - {name: node-secrets, mountPath: /secrets, readOnly: true}
            {{- end }}
            {{- if eq $component "ursula" }}
            - {name: data, mountPath: /data}
            {{- else if has $component (list "board" "controller" "station") }}
            - {name: secrets, mountPath: /secrets, readOnly: true}
            {{- if eq $component "controller" }}
            - {name: provider, mountPath: /provider, readOnly: true}
            {{- end }}
            {{- end }}
        {{- if eq $component "board" }}
        {{- with $settings.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      volumes:
        {{- if eq $component "node" }}
        - name: native-data
          persistentVolumeClaim:
            claimName: {{ default (include "transit.name" (dict "root" $ "component" "node")) $.Values.node.persistence.existingClaim }}
        {{- end }}
        {{- if and (eq $component "node") $.Values.node.existingSecret }}
        - name: node-secrets
          secret:
            secretName: {{ $.Values.node.existingSecret }}
            defaultMode: 288
        {{- end }}
        - name: config
          {{- if and (eq $component "ursula") $settings.existingConfigSecret }}
          secret:
            secretName: {{ $settings.existingConfigSecret }}
            defaultMode: 288
          {{- else }}
          configMap:
            name: {{ include "transit.name" $configCtx }}
          {{- end }}
        {{- if eq $component "ursula" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (include "transit.name" $ctx) $settings.persistence.existingClaim }}
        {{- else if has $component (list "board" "controller" "station") }}
        - name: secrets
          secret:
            secretName: {{ required (printf "%s.existingSecret is required; never put credentials in values" $component) $settings.existingSecret }}
            defaultMode: 288
        {{- if eq $component "controller" }}
        - name: provider
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken: {path: token, audience: {{ $settings.providerAudience | quote }}, expirationSeconds: 3600}
              - serviceAccountToken: {path: kube-token, expirationSeconds: 3600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $component := list "node" "ursula" "board" "controller" }}
{{ include "transit.workload" (dict "root" $ "component" $component) }}
{{- end }}
