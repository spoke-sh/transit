# Supply matching published or consuming-project images using immutable tags or
# digests. This chart does not install Substrate or grant Transit permissions.
imagePullSecrets: []
# Stop application services without removing their PVCs/configuration.
running: true
node:
  enabled: true
  nameOverride: ""
  image: ""
  # transit server configuration with external placement and local SQL disabled.
  # The server owns native bootstrap, maintenance and delivery on its retained PVC.
  config: {}
  # Optional original direct Table configuration for the local provider.
  table: null
  # Optional frozen server Station manifest; seed references use existingSecret.
  station: null
  # Required operator root seed (key: root), optional object-credentials.json/object-ca.pem for the tier, and registrar when Table hosting
  # is declared. Service credentials remain private in the server installation.
  existingSecret: ""
  persistence:
    existingClaim: ""
    size: 1Gi
    storageClass: null
  logging: {level: info, format: json}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "2", memory: 1Gi}

board:
  enabled: false
  nameOverride: ""
  image: ""
  # Key: seed (Transit inspection principal). Board has no viewer credential.
  existingSecret: ""
  # Board JSON fields, including realm, principal, and public_origin.
  # The chart fixes the listener, credential paths and internal node upstream.
  config: {}
  logging: {level: info, format: json}
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: "1", memory: 256Mi}
  # Reference-only pod-namespace isolation and transport-denial probes.
  # Empty in normal deployments; these can expand the pod's trust boundary.
  extraInitContainers: []
  extraContainers: []

# These policies require an enforcing CNI. They do not provide TLS or identity.
networkPolicy:
  enabled: true
  dnsNamespace: kube-system

# Optional capacity in an already-installed Agent Substrate cluster. Actor
# templates, recorded bindings and the runtime controller are separate concerns.
workerPool:
  enabled: false
  nameOverride: ""
  labels: {}
  spec: {}

# Version-specific pools permit fresh physical worker incarnations on upgrades.
workerPools: []

# Additional PID-scoped reconcilers. Each item overrides the controller defaults
# below and requires a unique nameOverride, config and existingSecret.
runtimeControllers: []

controller:
  enabled: false
  nameOverride: ""
  image: ""
  existingSecret: ""
  config: {}
  # Direct authenticated Substrate API; bearer audience matches its serving name.
  providerEndpoint: api.ate-system.svc:443
  providerAudience: api.ate-system.svc
  logging: {level: info, format: json}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
