# Select the matching published Transit image by immutable digest.
image: ""
imagePullSecrets: []
running: true
persistence:
  existingClaim: ""
  size: 10Gi
  storageClass: null
# null requires retained state on upgrades and when mounting an existing claim.
# After the first successful install, set true to also reject a missing
# installation on subsequent pod restarts. Never reset it to repair lost data.
requireExisting: null
# This Secret contains tls.crt, tls.key and password (no trailing newline).
# Certificates must cover the hostname used by remote consoles.
existingSecret: ""
account: owner
service:
  port: 19109
resources:
  requests: {cpu: "1", memory: 1Gi}
  limits: {cpu: "4", memory: 4Gi}
