{{- if .Values.networkPolicy.enabled }}
{{- range $component := list "board" "delivery" }}
{{- if (index $.Values $component).enabled }}
{{- $ctx := dict "root" $ "component" $component }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "transit.name" $ctx }}
  labels:
    {{- include "transit.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "transit.labels" $ctx | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "transit.labels" (dict "root" $ "component" "node") | nindent 14 }}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $.Values.networkPolicy.dnsNamespace | quote }}}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
{{- end }}
{{- end }}
{{- if .Values.ursula.enabled }}
{{- $ctx := dict "root" . "component" "ursula" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "transit.name" $ctx }}
  labels:
    {{- include "transit.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "transit.labels" $ctx | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $component := list "node" "maintenance" "initialize" }}
        - podSelector:
            matchLabels:
              {{- include "transit.labels" (dict "root" $ "component" $component) | nindent 14 }}
        {{- end }}
      ports: [{protocol: TCP, port: 8080}]
{{- end }}
{{- end }}
