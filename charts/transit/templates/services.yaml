{{- range $component := list "node" "ursula" "board" }}
{{- if (index $.Values $component).enabled }}
{{- $ctx := dict "root" $ "component" $component }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "transit.name" $ctx }}
  labels:
    {{- include "transit.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "transit.labels" $ctx | nindent 4 }}
  ports: [{name: http, port: 8080, targetPort: http}]
{{- end }}
{{- end }}
