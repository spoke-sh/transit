name: CI cost evidence
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Always run trusted default-branch tooling, never code from a PR artifact.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record completed run cost
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: python3 -B tests/runner/ci_cost.py --run "$RUN" --repo "$REPO" --enforce-regressions
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-cost-${{ github.event.workflow_run.id }}
          path: .cache/ci/cost-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
