name: Release distribution
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/actions/download-artifact/**'
      - '.github/workflows/nightly.yml'
      - '.github/workflows/ci.yml'
      - 'VERSION'
      - 'install.sh'
      - 'build/**'
      - 'build.zig*'
      - 'flake.*'
      - 'nix/**'
      - 'charts/**'
      - 'sdks/**'
      - 'bindings/**'
      - 'tasks/*release*'
      - 'tasks/bindings.just'
      - 'tasks/test.just'
      - 'tasks/package_sdks.py'
      - 'tasks/package_handbook.py'
      - 'docs/handbook/**'
      - 'tasks/version.py'
      - 'tests/runner/test_release.py'
      - 'tests/runner/test_release_identity.py'
      - 'tests/runner/test_publication.py'
      - 'tests/runner/test_version_build.py'
      - 'tests/interfaces/installation/release.py'
      - 'tests/interfaces/installation/published.py'
      - 'tests/interfaces/installation/server_applications.py'
      - 'tests/interfaces/installation/server_board.py'
      - 'tests/interfaces/installation/board_workbench.py'
      - 'tests/interfaces/installation/board_profiles.py'
      - 'tests/interfaces/installation/server_sql.py'
      - 'tests/interfaces/installation/server_sql_types.py'
      - 'tests/interfaces/sql_wire/type_cases.py'
      - 'tests/interfaces/cli/operations/**'
      - 'tests/harness/local_installation.py'
      - 'tests/harness/operation_helpers.py'
      - 'tests/interfaces/cli/console_terminal.py'
      - 'tests/interfaces/cli/console_edit.py'
      - 'apps/transit-board-web/browser/workbench.spec.ts'
      - 'tests/sdk/**'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Build candidate artifacts without publishing'
        type: choice
        options: [stable, nightly]
        default: stable
  workflow_call:
    inputs:
      channel:
        type: string
        default: stable
      publish:
        type: boolean
        default: false
permissions:
  contents: read
env:
  TRANSIT_RELEASE_IDENTITY: ${{ github.workspace }}/.cache/release-identity.json
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  # PR candidates cannot publish. Qualify the latest commit promptly, while
  # immutable tag/nightly publication must finish or fail without interruption.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 5
    env:
      TRANSIT_RELEASE_IDENTITY: ''
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      revision: ${{ steps.identity.outputs.revision }}
      channel: ${{ steps.identity.outputs.channel }}
      publish: ${{ steps.identity.outputs.publish }}
      skip: ${{ steps.identity.outputs.skip }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze the source and distribution identity
        id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PRs exercise prerelease package versions and loader markers too.
          CHANNEL: ${{ inputs.channel || (github.event_name == 'pull_request' && 'nightly' || 'stable') }}
          PUBLISH: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (inputs.publish == true && github.ref == 'refs/heads/main')) && 'true' || 'false' }}
        run: python3 -B tasks/release_channel.py prepare --channel "$CHANNEL" --publish "$PUBLISH" --output .cache/release-identity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-identity
          path: .cache/release-identity.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  console-latency:
    name: Console latency gate
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    # Optimized compilation is preparation, not a console latency sample.
    timeout-minutes: 60
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache/ci-zig
      ZIG_LOCAL_PKG_DIR: ${{ github.workspace }}/.cache/ci-zig/p
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reclaim unused hosted SDKs
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          df -h /
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Restore Nix store
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-v2-experience-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix', 'nix/*.patch', 'nix/vite-plus/**', 'nix/ate-upgrade/**', 'deploy/reference/versions.json') }}
          restore-prefixes-first-match: |
            nix-v2-experience-${{ runner.os }}-${{ runner.arch }}-
            nix-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore Zig standard libraries and fetched packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cache/ci-zig/o
            .cache/ci-zig/h
            .cache/ci-zig/p
          key: zig-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            zig-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
            zig-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
            zig-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
      - name: Fetch pinned Zig dependencies
        run: nix develop .#ci-experience --command just ci::dependencies
      - name: Build optimized console latency executables
        timeout-minutes: 40
        run: nix develop .#ci-experience --command zig build transit -Doptimize=ReleaseSafe --prefix .cache/transit-latency/release
      - name: Qualify console startup and statement latency budgets
        timeout-minutes: 10
        run: nix develop .#ci-experience --command python3 -B tests/runner/launch.py tests/performance/console/gate.py --cli .cache/transit-latency/release/bin/transit --node .cache/transit-latency/release/bin/transit --host .cache/transit-latency/release/bin/transit
      - name: Qualify installed SQL scalar interfaces
        timeout-minutes: 5
        run: nix develop .#ci-experience --command python3 -B tests/runner/launch.py tests/interfaces/installation/server_sql_types.py --cli .cache/transit-latency/release/bin/transit
      - name: Preserve console latency gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-console-latency-${{ github.run_attempt }}
          path: |
            .cache/transit-latency/gate/*.json
            .cache/transit-latency/gate/*.jsonl
            .cache/sql-types/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  qualification:
    # Every publishing channel qualifies this exact captured source revision.
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      release_qualification: true
  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            artifact: release-artifacts
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            artifact: release-arm64-artifacts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache/ci-zig
      ZIG_LOCAL_PKG_DIR: ${{ github.workspace }}/.cache/ci-zig/p
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the source-bound release identity
        uses: ./.github/actions/download-artifact
        with:
          name: release-identity
          path: .cache
      - name: Reclaim unused hosted SDKs
        if: runner.environment == 'github-hosted'
        # Consumed language runtimes come from Nix; leave user-managed runners alone.
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          df -h /
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Restore Nix store
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-v2-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix', 'nix/*.patch', 'nix/vite-plus/**', 'nix/ate-upgrade/**', 'deploy/reference/versions.json') }}
          restore-prefixes-first-match: |
            nix-v2-release-${{ runner.os }}-${{ runner.arch }}-
            nix-v2-experience-${{ runner.os }}-${{ runner.arch }}-
            nix-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore Zig standard libraries and fetched packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cache/ci-zig/o
            .cache/ci-zig/h
            .cache/ci-zig/p
          key: zig-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            zig-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
            zig-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
            zig-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
      - name: Check release identity
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 -B tasks/version.py --tag "$REF_NAME"
          else
            python3 -B tasks/version.py
          fi
      - name: Check installer and packaging controls
        run: nix develop .#release --command python3 -B tests/runner/test_release.py
      - name: Build native static Linux release
        run: python3 -B tasks/build_release.py --out-link .cache/release-runtime --cores 2
      - name: Fetch pinned Zig dependencies
        run: nix develop .#release-checks --command just ci::dependencies
      - name: Qualify installed startup, SQL and retained restart
        run: nix develop .#release-checks --command just test::release .cache/release-runtime
      - name: Retain the private operation fixture for installation checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operation-fixture-${{ matrix.artifact }}
          path: zig-out/tests/operation-fixture
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Validate Helm deployment boundaries
        if: matrix.architecture == 'x86_64'
        run: nix develop .#release --command just test::deployments
      - name: Package deterministic archives and checksums
        run: nix develop .#release --command python3 -B tasks/package_release.py --prefix .cache/release-runtime --output dist/release
      - name: Retain qualified runtime artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-${{ matrix.artifact }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  images:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            artifact: release-artifacts
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            artifact: release-arm64-artifacts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-artifact
        with:
          name: release-identity
          path: .cache
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Restore Nix store
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-v2-bindings-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix', 'nix/*.patch', 'nix/vite-plus/**', 'nix/ate-upgrade/**', 'deploy/reference/versions.json') }}
          restore-prefixes-first-match: |
            nix-v2-bindings-${{ runner.os }}-${{ runner.arch }}-
            nix-v1-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/download-artifact
        with:
          name: runtime-${{ matrix.artifact }}
          path: dist/release
      - name: Build and smoke test native container images
        run: nix develop .#release --command python3 -B tasks/release_images.py dist/release --diagnostics .cache/release-images
      - name: Preserve image conversion diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-diagnostics-${{ matrix.architecture }}
          path: .cache/release-images/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain qualified image and runtime artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  sdk-build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            artifact: release-artifacts
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            artifact: release-arm64-artifacts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache/ci-zig
      ZIG_LOCAL_PKG_DIR: ${{ github.workspace }}/.cache/ci-zig/p
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore the source-bound release identity
        uses: ./.github/actions/download-artifact
        with:
          name: release-identity
          path: .cache
      - name: Reclaim unused hosted SDKs
        if: runner.environment == 'github-hosted'
        # Consumed language runtimes come from Nix; leave user-managed runners alone.
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          df -h /
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Restore Nix store
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-v2-bindings-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix', 'nix/*.patch', 'nix/vite-plus/**', 'nix/ate-upgrade/**', 'deploy/reference/versions.json') }}
          restore-prefixes-first-match: |
            nix-v2-bindings-${{ runner.os }}-${{ runner.arch }}-
            nix-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore Zig standard libraries and fetched packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cache/ci-zig/o
            .cache/ci-zig/h
            .cache/ci-zig/p
          key: zig-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            zig-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
            zig-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
            zig-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
      - name: Fetch pinned Zig dependencies
        run: nix develop .#bindings --command just ci::dependencies
      - name: Build bundled dependency notices
        run: nix build .#transit-release.notices --out-link .cache/release-notices -L
      - name: Install locked language dependencies
        run: nix develop .#bindings --command vp install --frozen-lockfile
      - name: Build portable SDK packages
        run: nix develop .#bindings --command just bindings::release-build .cache/sdk-release
      - name: Package SDK archives and dependency closure
        run: python3 -B tasks/package_sdks.py .cache/sdk-release dist/sdks --notices .cache/release-notices
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-consumer-inputs-${{ matrix.architecture }}
          path: .cache/sdk-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-release-artifacts-${{ matrix.architecture }}
          path: dist/sdks/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  sdk-loaders:
    needs: [prepare, sdk-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            artifact: release-artifacts
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            artifact: release-arm64-artifacts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore the source-bound release identity
        uses: ./.github/actions/download-artifact
        with:
          name: release-identity
          path: .cache
      - uses: ./.github/actions/download-artifact
        with:
          name: sdk-consumer-inputs-${{ matrix.architecture }}
          path: .cache/sdk-release
      - name: Load shipped SDK libraries and hosts without Nix
        run: python3 -B tests/runner/launch.py tests/sdk/release_loader.py .cache/sdk-release
  sdk-consumers:
    needs: [prepare, build, sdk-build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86_64, aarch64]
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            artifact: release-artifacts
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            artifact: release-arm64-artifacts
        language: [python, node, rust, ruby, c, java, dotnet, beam, go]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore the source-bound release identity
        uses: ./.github/actions/download-artifact
        with:
          name: release-identity
          path: .cache
      - name: Reclaim unused hosted SDKs
        if: runner.environment == 'github-hosted'
        # Consumed language runtimes come from Nix; leave user-managed runners alone.
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          df -h /
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Restore Nix store
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-v2-bindings-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix', 'nix/*.patch', 'nix/vite-plus/**', 'nix/ate-upgrade/**', 'deploy/reference/versions.json') }}
          restore-prefixes-first-match: |
            nix-v2-bindings-${{ runner.os }}-${{ runner.arch }}-
            nix-v1-${{ runner.os }}-${{ runner.arch }}-
      - uses: ./.github/actions/download-artifact
        with:
          name: runtime-${{ matrix.artifact }}
          path: dist/release
      - uses: ./.github/actions/download-artifact
        with:
          name: sdk-consumer-inputs-${{ matrix.architecture }}
          path: .cache/sdk-release
      - name: Restore executable modes and unpack runtime
        run: |
          chmod +x .cache/sdk-release/native/bin/* .cache/sdk-release/native/tests/* .cache/sdk-release/c-sdk/bin/*
          mkdir -p .cache/runtime
          tar -xf "dist/release/transit-${{ needs.prepare.outputs.version }}-linux-${{ matrix.architecture }}.tar.gz" --strip-components=1 -C .cache/runtime
      - name: Fetch locked Rust registry dependencies
        if: matrix.language == 'rust'
        # The consumer job has a fresh Cargo cache. Preparation may download
        # locked third-party crates; installed consumer builds remain offline.
        run: |
          nix develop .#bindings --command cargo fetch --locked --manifest-path sdks/rust/transit-client/Cargo.toml
          nix develop .#bindings --command cargo fetch --locked --manifest-path sdks/rust/transit-station-sdk/Cargo.toml
          nix develop .#bindings --command cargo fetch --locked --manifest-path examples/station-sdk/rust/Cargo.toml
      - name: Qualify installed raw client and available Station adapter
        env:
          LANGUAGE: ${{ matrix.language }}
        run: nix develop .#bindings --command just bindings::release-test .cache/sdk-release .cache/runtime --language "$LANGUAGE"
  sdk-zig:
    needs: [prepare, build, sdk-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            artifact: release-artifacts
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            artifact: release-arm64-artifacts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache/ci-zig
      ZIG_LOCAL_PKG_DIR: ${{ github.workspace }}/.cache/ci-zig/p
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore the source-bound release identity
        uses: ./.github/actions/download-artifact
        with:
          name: release-identity
          path: .cache
      - name: Reclaim unused hosted SDKs
        if: runner.environment == 'github-hosted'
        # Consumed language runtimes come from Nix; leave user-managed runners alone.
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          df -h /
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Restore Nix store
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-v2-bindings-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix', 'nix/*.patch', 'nix/vite-plus/**', 'nix/ate-upgrade/**', 'deploy/reference/versions.json') }}
          restore-prefixes-first-match: |
            nix-v2-bindings-${{ runner.os }}-${{ runner.arch }}-
            nix-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore Zig standard libraries and fetched packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cache/ci-zig/o
            .cache/ci-zig/h
            .cache/ci-zig/p
          key: zig-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            zig-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
            zig-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
            zig-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
      - uses: ./.github/actions/download-artifact
        with:
          name: runtime-${{ matrix.artifact }}
          path: dist/release
      - uses: ./.github/actions/download-artifact
        with:
          name: sdk-release-artifacts-${{ matrix.architecture }}
          path: dist/sdks
      - name: Restore the matching private operation fixture
        uses: ./.github/actions/download-artifact
        with:
          name: operation-fixture-${{ matrix.artifact }}
          path: .cache/operation-fixture
      - name: Restore the fixture executable mode
        run: chmod 755 .cache/operation-fixture/operation-fixture
      - name: Build the public application and qualify installation and replacement
        env:
          TEST_TRANSIT_OPERATIONS: ${{ github.workspace }}/.cache/operation-fixture/operation-fixture
        run: |
          mkdir -p .cache/runtime
          tar -xf "dist/release/transit-${{ needs.prepare.outputs.version }}-linux-${{ matrix.architecture }}.tar.gz" --strip-components=1 -C .cache/runtime
          nix develop .#bindings --command just bindings::release-zig "dist/sdks/transit-sdk-zig-${{ needs.prepare.outputs.version }}-source.tar.gz" .cache/runtime
  installed:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: release-artifacts
          - runner: ubuntu-24.04-arm
            artifact: release-arm64-artifacts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore the source-bound release identity
        uses: ./.github/actions/download-artifact
        with:
          name: release-identity
          path: .cache
      - uses: ./.github/actions/download-artifact
        with:
          name: runtime-${{ matrix.artifact }}
          path: dist/release
      - name: Restore the matching private operation fixture
        uses: ./.github/actions/download-artifact
        with:
          name: operation-fixture-${{ matrix.artifact }}
          path: .cache/operation-fixture
      - name: Restore the fixture executable mode
        run: chmod 755 .cache/operation-fixture/operation-fixture
      - name: Install and qualify downloaded artifacts without Nix
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          TEST_TRANSIT_OPERATIONS: ${{ github.workspace }}/.cache/operation-fixture/operation-fixture
        run: python3 -B tests/runner/launch.py tests/interfaces/installation/published.py --artifacts dist/release --version "${{ needs.prepare.outputs.version }}" --revision "$EXPECTED_REVISION"
  board:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            artifact: release-artifacts
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            artifact: release-arm64-artifacts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-artifact
        with:
          name: release-identity
          path: .cache
      - uses: ./.github/actions/download-artifact
        with:
          name: runtime-${{ matrix.artifact }}
          path: dist/release
      - name: Restore the matching private operation fixture
        uses: ./.github/actions/download-artifact
        with:
          name: operation-fixture-${{ matrix.artifact }}
          path: .cache/operation-fixture
      - name: Restore the fixture executable mode
        run: chmod 755 .cache/operation-fixture/operation-fixture
      - name: Install the exact downloaded runtime
        run: |
          cd dist/release
          sha256sum --check SHA256SUMS
          sh install.sh --version "${{ needs.prepare.outputs.version }}" --from . --prefix "$GITHUB_WORKSPACE/.cache/runtime"
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Install locked browser tooling
        run: nix develop .#ci-experience --command just transit-board::install
      - name: Install Chromium and host dependencies
        run: nix develop .#ci-experience --command vp exec --filter @transit/board-web playwright install --with-deps chromium
      - name: Qualify installed catalog, previews and workbook
        env:
          TEST_TRANSIT_OPERATIONS: ${{ github.workspace }}/.cache/operation-fixture/operation-fixture
        run: nix develop .#ci-experience --command just test::release-board .cache/runtime
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-board-failure-${{ matrix.architecture }}
          path: |
            .cache/board-workbench/
            .cache/transit-board-browser/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  handbook:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore the source-bound release identity
        uses: ./.github/actions/download-artifact
        with:
          name: release-identity
          path: .cache
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - run: nix develop .#docs --command just transit-docs::install
      - name: Check and build the versioned handbook
        env:
          TRANSIT_DOCS_BASE_URL: /
          TRANSIT_DOCS_REVISION: ${{ github.sha }}
        run: nix develop .#docs --command just transit-docs::check
      - name: Install the handbook browser
        run: nix develop .#docs --command vp exec --filter @transit/docs playwright install --with-deps chromium
      - name: Package and extract the standalone handbook
        run: |
          python3 -B tasks/package_handbook.py docs/handbook/dist dist/handbook
          mkdir -p .cache/release-handbook
          tar -xf "dist/handbook/transit-handbook-${{ needs.prepare.outputs.version }}.tar.gz" --strip-components=1 -C .cache/release-handbook
      - name: Qualify the archived handbook's routes, search and exact downloads
        env:
          TRANSIT_DOCS_BASE_URL: /
          TRANSIT_DOCS_REVISION: ${{ github.sha }}
          TRANSIT_DOCS_TEST_ARCHIVE: '1'
        run: nix develop .#docs --command vp exec --filter @transit/docs playwright test
      - name: Preserve handbook browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: handbook-browser-failure
          path: .cache/verification/docs-browser/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: handbook-release-artifacts
          path: dist/handbook/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  assemble:
    needs: [prepare, build, images, sdk-build, handbook]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore the source-bound release identity
        uses: ./.github/actions/download-artifact
        with:
          name: release-identity
          path: .cache
      - uses: ./.github/actions/download-artifact
        with:
          name: release-artifacts
          path: dist/release
      - uses: ./.github/actions/download-artifact
        with:
          name: sdk-release-artifacts-x86_64
          path: dist/sdks
      - uses: ./.github/actions/download-artifact
        with:
          name: release-arm64-artifacts
          path: dist/arm64
      - uses: ./.github/actions/download-artifact
        with:
          name: handbook-release-artifacts
          path: dist/handbook
      - uses: ./.github/actions/download-artifact
        with:
          name: sdk-release-artifacts-aarch64
          path: dist/arm64-sdks
      - name: Assemble matching qualified artifacts
        run: python3 -B tasks/assemble_release.py dist/release dist/sdks --arm64 dist/arm64 --handbook dist/handbook --arm64-sdks dist/arm64-sdks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assembled-release-artifacts
          path: dist/release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  homebrew:
    needs: [prepare, assemble]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            artifact: release-artifacts
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            artifact: release-arm64-artifacts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore the source-bound release identity
        uses: ./.github/actions/download-artifact
        with:
          name: release-identity
          path: .cache
      - uses: ./.github/actions/download-artifact
        with:
          name: assembled-release-artifacts
          path: dist/release
      - name: Restore the matching private operation fixture
        uses: ./.github/actions/download-artifact
        with:
          name: operation-fixture-${{ matrix.artifact }}
          path: .cache/operation-fixture
      - name: Restore the fixture executable mode
        run: chmod 755 .cache/operation-fixture/operation-fixture
      - uses: Homebrew/actions/setup-homebrew@ae72030040bc05e2d65c41c577092cb98bc0a27e
      - name: Install the exact formula with its checksummed candidate archive
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          TEST_TRANSIT_OPERATIONS: ${{ github.workspace }}/.cache/operation-fixture/operation-fixture
        run: python3 -B tasks/verify_release_brew.py dist/release
  publish:
    needs: [prepare, console-latency, qualification, build, images, installed, board, sdk-consumers, sdk-zig, sdk-loaders, assemble, homebrew]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the source-bound release identity
        uses: ./.github/actions/download-artifact
        with:
          name: release-identity
          path: .cache
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - uses: ./.github/actions/download-artifact
        with:
          name: assembled-release-artifacts
          path: dist/release
      - name: Publish immutable image, chart and release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | nix develop .#release --command skopeo login ghcr.io --username "$REGISTRY_USER" --password-stdin
          printf '%s' "$GH_TOKEN" | nix develop .#release --command helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          nix develop .#release --command python3 -B tasks/publish_release.py dist/release
  published:
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: release-artifacts
          - runner: ubuntu-24.04-arm
            artifact: release-arm64-artifacts
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Restore the source-bound release identity
        uses: ./.github/actions/download-artifact
        with:
          name: release-identity
          path: .cache
      - name: Restore the matching private operation fixture
        uses: ./.github/actions/download-artifact
        with:
          name: operation-fixture-${{ matrix.artifact }}
          path: .cache/operation-fixture
      - name: Restore the fixture executable mode
        run: chmod 755 .cache/operation-fixture/operation-fixture
      - name: Install the public release without authentication or Nix
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          TEST_TRANSIT_OPERATIONS: ${{ github.workspace }}/.cache/operation-fixture/operation-fixture
        run: python3 -B tests/runner/launch.py tests/interfaces/installation/published.py --version "${{ needs.prepare.outputs.version }}" --revision "$EXPECTED_REVISION"
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Verify anonymous container and chart downloads
        run: nix develop .#release --command python3 -B tasks/verify_release_registries.py
  promote-nightly:
    needs: [prepare, published]
    if: needs.prepare.outputs.channel == 'nightly' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: transit-nightly-promotion
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/download-artifact
        with:
          name: release-identity
          path: .cache
      - uses: ./.github/actions/download-artifact
        with:
          name: assembled-release-artifacts
          path: dist/release
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Advance the verified nightly channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | nix develop .#release --command skopeo login ghcr.io --username "$REGISTRY_USER" --password-stdin
          nix develop .#release --command python3 -B tasks/release_channel.py promote dist/release
