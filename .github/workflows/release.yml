name: Release distribution
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/ci.yml'
      - 'VERSION'
      - 'install.sh'
      - 'build/**'
      - 'build.zig*'
      - 'flake.*'
      - 'nix/**'
      - 'charts/**'
      - 'sdks/**'
      - 'bindings/**'
      - 'tasks/*release*'
      - 'tasks/version.py'
      - 'tests/runner/test_release.py'
      - 'tests/runner/test_publication.py'
      - 'tests/runner/test_version_build.py'
      - 'tests/interfaces/installation/release.py'
      - 'tests/interfaces/installation/published.py'
      - 'tests/interfaces/installation/server_applications.py'
      - 'tests/sdk/release*.py'
      - 'tests/sdk/consumer_registry.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  qualification:
    # The full ordinary CI matrix must pass on this exact tag before publishing.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Check release identity
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 -B tasks/version.py --tag "$REF_NAME"
          else
            python3 -B tasks/version.py
          fi
      - name: Check installer and packaging controls
        run: nix develop .#release --command python3 -B tests/runner/test_release.py
      - name: Build static Linux x86_64 release
        run: nix build .#transit-release --out-link .cache/release-runtime --cores 2 -L
      - name: Qualify installed startup, SQL and retained restart
        run: nix develop .#ci-experience --command just test::release .cache/release-runtime
      - name: Validate Helm deployment boundaries
        run: nix develop --command just test::deployments
      - name: Package deterministic archives and checksums
        run: nix develop .#release --command python3 -B tasks/package_release.py --prefix .cache/release-runtime --output dist/release
      - name: Build and smoke test container images
        run: nix develop .#release --command python3 -B tasks/release_images.py dist/release
      - name: Retain qualified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  sdk-build:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: dist/release
      - name: Unpack matching runtime
        run: mkdir -p .cache/runtime && tar -xf "dist/release/transit-$(cat VERSION)-linux-x86_64.tar.gz" --strip-components=1 -C .cache/runtime
      - name: Install locked language dependencies
        run: nix develop .#bindings --command vp install --frozen-lockfile
      - name: Build portable SDK packages
        run: nix develop .#bindings --command just bindings::release-build .cache/sdk-release
      - name: Package SDK archives and dependency closure
        run: python3 -B tasks/package_sdks.py .cache/sdk-release dist/sdks --notices .cache/runtime/notices
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-consumer-inputs
          path: .cache/sdk-release/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-release-artifacts
          path: dist/sdks/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  sdk-consumers:
    needs: sdk-build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        language: [python, node, rust, ruby, c, java, dotnet, beam, go]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: dist/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-consumer-inputs
          path: .cache/sdk-release
      - name: Restore executable modes and unpack runtime
        run: |
          chmod +x .cache/sdk-release/native/bin/* .cache/sdk-release/c-sdk/bin/*
          mkdir -p .cache/runtime
          tar -xf "dist/release/transit-$(cat VERSION)-linux-x86_64.tar.gz" --strip-components=1 -C .cache/runtime
      - name: Qualify installed raw client and available Station adapter
        env:
          LANGUAGE: ${{ matrix.language }}
        run: nix develop .#bindings --command just bindings::release-test .cache/sdk-release .cache/runtime --language "$LANGUAGE"
  sdk-zig:
    needs: sdk-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: dist/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-release-artifacts
          path: dist/sdks
      - name: Build the public application and qualify installation and replacement
        run: |
          mkdir -p .cache/runtime
          tar -xf "dist/release/transit-$(cat VERSION)-linux-x86_64.tar.gz" --strip-components=1 -C .cache/runtime
          nix develop .#bindings --command just bindings::release-zig "dist/sdks/transit-sdk-zig-$(cat VERSION)-source.tar.gz" .cache/runtime
  installed:
    needs: [build, sdk-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: dist/release
      - name: Install and qualify downloaded artifacts without Nix
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: python3 -B tests/runner/launch.py tests/interfaces/installation/published.py --artifacts dist/release --version "$(cat VERSION)" --revision "$EXPECTED_REVISION"
  publish:
    needs: [qualification, build, installed, sdk-consumers, sdk-zig]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
          path: dist/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-release-artifacts
          path: dist/sdks
      - name: Assemble matching qualified artifacts
        run: python3 -B tasks/assemble_release.py dist/release dist/sdks
      - name: Publish immutable image, chart and release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -B tasks/version.py --tag "$RELEASE_TAG"
          printf '%s' "$GH_TOKEN" | nix develop .#release --command skopeo login ghcr.io --username "$REGISTRY_USER" --password-stdin
          printf '%s' "$GH_TOKEN" | nix develop .#release --command helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          nix develop .#release --command python3 -B tasks/publish_release.py dist/release
  published:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the public release without authentication or Nix
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: python3 -B tests/runner/launch.py tests/interfaces/installation/published.py --version "$(cat VERSION)" --revision "$EXPECTED_REVISION"
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Verify anonymous container and chart downloads
        run: nix develop .#release --command python3 -B tasks/verify_release_registries.py
