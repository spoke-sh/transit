name: CI
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release_qualification:
        type: boolean
        default: false
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      cache_mode:
        description: 'GitHub dependency caches (cold still uses upstream Nix binary substitutes)'
        type: choice
        options: [reuse, cold]
        default: reuse
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
concurrency:
  # Explicit qualification samples may share one branch's immutable caches.
  # Superseded PR/push runs still cancel; independent dispatches stay independent.
  group: ci-${{ inputs.release_qualification && format('release-{0}', github.run_id) || github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}-${{ inputs.cache_mode || 'reuse' }}
  cancel-in-progress: true
jobs:
  plan:
    name: Selection and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.select.outputs.full }}
      checks: ${{ steps.select.outputs.checks }}
      documentation: ${{ steps.select.outputs.documentation }}
      runtime_matrix: ${{ steps.select.outputs.runtime_matrix }}
      sdk_matrix: ${{ steps.select.outputs.sdk_matrix }}
      native_matrix: ${{ steps.select.outputs.native_matrix }}
      runtime_checks: ${{ steps.select.outputs.runtime_checks }}
      sdks: ${{ steps.select.outputs.sdks }}
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select required checks
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B tests/runner/ci_select.py --event "$EVENT" --base "$BASE" --head "$HEAD"
      - name: Check documentation
        run: python3 -B tests/runner/docs.py
      - name: Check package and release versions
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 -B tasks/version.py --tag "$REF_NAME"
          else
            python3 -B tasks/version.py
          fi
      - name: Check whitespace
        run: git show --format= --check HEAD
  documentation:
    name: Documentation site
    needs: plan
    if: needs.plan.outputs.documentation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Install locked documentation dependencies
        run: nix develop .#docs --command vp install --frozen-lockfile --filter transit --filter @transit/docs
      - name: Build and check the documentation site
        run: nix develop .#docs --command just transit-docs::check
  console-latency:
    name: Console latency and SQL interfaces
    needs: plan
    if: needs.plan.outputs.checks == 'true'
    runs-on: ${{ vars.TRANSIT_CI_RUNNER || 'ubuntu-24.04' }}
    # Optimized compilation is preparation, not a console latency sample.
    timeout-minutes: 60
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache/ci-zig
      ZIG_LOCAL_PKG_DIR: ${{ github.workspace }}/.cache/ci-zig/p
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
      - name: Reclaim unused hosted SDKs
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          df -h /
      - name: Restore Nix store
        if: inputs.cache_mode != 'cold'
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-v2-experience-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix', 'nix/*.patch', 'nix/vite-plus/**', 'nix/ate-upgrade/**', 'deploy/reference/versions.json') }}
          restore-prefixes-first-match: |
            nix-v2-experience-${{ runner.os }}-${{ runner.arch }}-
            nix-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore Zig standard libraries and fetched packages
        if: inputs.cache_mode != 'cold'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cache/ci-zig/o
            .cache/ci-zig/h
            .cache/ci-zig/p
          key: zig-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            zig-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
            zig-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
            zig-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
      - name: Fetch pinned Zig dependencies
        run: nix develop .#ci-experience --command just ci::dependencies
      - name: Build optimized console latency executables
        timeout-minutes: 40
        run: nix develop .#ci-experience --command zig build transit -Doptimize=ReleaseSafe --prefix .cache/transit-latency/release
      - name: Qualify console startup and statement latency budgets
        timeout-minutes: 10
        run: nix develop .#ci-experience --command python3 -B tests/runner/launch.py tests/performance/console/gate.py --cli .cache/transit-latency/release/bin/transit --node .cache/transit-latency/release/bin/transit --host .cache/transit-latency/release/bin/transit
      - name: Qualify installed SQL scalar interfaces
        timeout-minutes: 5
        run: nix develop .#ci-experience --command python3 -B tests/runner/launch.py tests/interfaces/installation/server_sql_types.py --cli .cache/transit-latency/release/bin/transit
      - name: Preserve console latency gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-console-latency-${{ github.run_attempt }}
          path: |
            .cache/transit-latency/gate/*.json
            .cache/transit-latency/gate/*.jsonl
            .cache/sql-types/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  native:
    name: native-${{ matrix.family }}-${{ matrix.optimize }}
    needs: plan
    if: needs.plan.outputs.sdks == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.native_matrix) }}
    uses: ./.github/workflows/ci-lane.yml
    with:
      lane: native-${{ matrix.family }}-${{ matrix.optimize }}
      shell: ci-experience
      cache: experience
      timeout: 45
      selection: ${{ needs.plan.outputs.selection }}
      cache_mode: ${{ inputs.cache_mode || 'reuse' }}
      native_family: ${{ matrix.family }}
      native_optimize: ${{ matrix.optimize }}
  checks:
    name: ${{ matrix.lane }}
    needs: plan
    if: needs.plan.outputs.runtime_checks == 'true'
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.plan.outputs.runtime_matrix) }}
    uses: ./.github/workflows/ci-lane.yml
    with:
      lane: ${{ matrix.lane }}
      shell: ${{ matrix.shell }}
      cache: ${{ matrix.cache }}
      cache_writer: ${{ matrix.cache_writer }}
      timeout: ${{ matrix.timeout }}
      selection: ${{ needs.plan.outputs.selection }}
      cache_mode: ${{ inputs.cache_mode || 'reuse' }}
  sdks:
    name: ${{ matrix.lane }}
    needs: [plan, native]
    if: needs.plan.outputs.sdks == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.sdk_matrix) }}
    uses: ./.github/workflows/ci-lane.yml
    with:
      lane: ${{ matrix.lane }}
      shell: ${{ matrix.shell }}
      cache: ${{ matrix.cache }}
      cache_writer: ${{ matrix.cache_writer }}
      timeout: ${{ matrix.timeout }}
      selection: ${{ needs.plan.outputs.selection }}
      cache_mode: ${{ inputs.cache_mode || 'reuse' }}
      native_bundle: true
  foundation-and-protocol:
    # Preserve the previous required-check name across the decomposition.
    if: always()
    needs: [plan, console-latency, checks, native, sdks, documentation]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected check
        env:
          PLAN: ${{ needs.plan.result }}
          ALL_CHECKS: ${{ needs.plan.outputs.checks }}
          GATE: ${{ needs.console-latency.result }}
          CHECKS: ${{ needs.plan.outputs.runtime_checks }}
          SDKS: ${{ needs.plan.outputs.sdks }}
          SDK_RESULT: ${{ needs.sdks.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          DOCUMENTATION: ${{ needs.plan.outputs.documentation }}
          RESULT: ${{ needs.checks.result }}
          DOCS: ${{ needs.documentation.result }}
        run: |
          test "$PLAN" = success
          case "$ALL_CHECKS:$GATE" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
          case "$CHECKS:$RESULT" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
          case "$SDKS:$NATIVE_RESULT:$SDK_RESULT" in
            true:success:success|false:skipped:skipped) ;;
            *) exit 1 ;;
          esac
          case "$DOCUMENTATION:$DOCS" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
          test "$CHECKS:$SDKS:$DOCUMENTATION" != false:false:false
