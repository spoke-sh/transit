name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      cache_mode:
        description: 'GitHub dependency caches (cold still uses upstream Nix binary substitutes)'
        type: choice
        options: [reuse, cold]
        default: reuse
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.cache_mode || 'reuse' }}
  cancel-in-progress: true
jobs:
  plan:
    name: Selection and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select required checks
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B tests/ci_select.py --event "$EVENT" --base "$BASE" --head "$HEAD"
      - name: Check documentation
        run: python3 -B tests/docs.py
      - name: Check whitespace
        run: git show --format= --check HEAD
  documentation:
    name: Documentation site
    needs: plan
    if: needs.plan.outputs.full == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Install locked documentation dependencies
        run: nix develop .#docs --command vp install --frozen-lockfile --filter rey --filter @rey/transit-docs
      - name: Build and check the documentation site
        run: nix develop .#docs --command just transit-docs::check
  checks:
    name: ${{ matrix.lane }}
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ${{ vars.TRANSIT_CI_RUNNER || 'ubuntu-24.04' }}
    # Expanded inventories need finite execution caps distinct from the older
    # measured feedback budgets. Task-local progress deadlines are unchanged.
    timeout-minutes: ${{ matrix.timeout || (inputs.cache_mode == 'cold' && 45 || 30) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: core
            shell: default
            cache: core
            cache_writer: true
          - lane: growth
            shell: default
            cache: core
            cache_writer: false
            timeout: 90
          - lane: experience
            shell: ci-experience
            cache: experience
            cache_writer: true
            timeout: 60
          - lane: launchers
            shell: ci-experience
            cache: experience
            cache_writer: false
          - lane: bindings
            shell: ci-bindings
            cache: bindings
            cache_writer: true
            timeout: 240
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache/ci-zig
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record dependency cache mode
        env:
          MODE: ${{ inputs.cache_mode || 'reuse' }}
        run: 'echo "CI dependency cache mode: $MODE"'
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true
      - name: Reclaim unused hosted SDKs
        if: runner.environment == 'github-hosted'
        # Cache extraction and cold Ursula builds both need this space. Every
        # consumed SDK comes from the pinned Nix shell; never remove software
        # from a user-managed runner.
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          df -h /
      - name: Restore Nix store
        id: nix-cache
        if: inputs.cache_mode != 'cold'
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          # Separate closures: the experience lane never restores Kubernetes,
          # provider CLIs, PyArrow, or their build dependencies. Small local
          # plugin/environment changes rebuild locally without a store upload.
          primary-key: nix-v2-${{ matrix.cache }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/*.nix', 'nix/vite-plus/**', 'nix/ate-upgrade/**', 'deploy/reference/versions.json') }}
          # Seed new lane caches from the existing store once, avoiding a cold
          # Ursula Rust build just because the workflow was decomposed.
          restore-prefixes-first-match: |
            nix-v2-${{ matrix.cache }}-${{ runner.os }}-${{ runner.arch }}-
            nix-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare development shell
        id: shell
        # Keep the shell closure rooted through cache GC; a temporary `-c true`
        # alone would let GC discard the binaries we just spent time building.
        run: nix develop .#${{ matrix.shell }} --profile "$RUNNER_TEMP/transit-ci-shell" --command true
      - name: Save Nix store
        # Preserve the rooted toolchain before long tests can be cancelled.
        # Test outcomes remain separate; no checkout artifacts enter this cache.
        if: ${{ !cancelled() && inputs.cache_mode != 'cold' && matrix.cache_writer && steps.shell.outcome == 'success' && steps.nix-cache.outputs.hit-primary-key != 'true' }}
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: ${{ steps.nix-cache.outputs.primary-key }}
          # Keep the rooted lane closure, not arbitrary downloaded build state.
          # A GC target is not a hard cap; live roots are always retained.
          gc-max-store-size-linux: '0'
      - name: Restore Zig standard libraries and fetched packages
        id: zig-cache
        if: inputs.cache_mode != 'cold'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Deliberately exclude checkout object files (multi-GB per profile),
          # mutable launcher data and Zig's Git transport archive cache.
          path: |
            .cache/ci-zig/o
            .cache/ci-zig/h
            .cache/ci-zig/p
          key: zig-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('**/build.zig.zon') }}
          restore-keys: |
            zig-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
            zig-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
      - name: Install locked Board frontend dependencies
        if: matrix.lane == 'experience' || matrix.lane == 'launchers'
        run: nix develop .#${{ matrix.shell }} --command just transit-board::install
      - name: Install locked Node binding dependencies
        if: matrix.lane == 'bindings'
        run: nix develop .#${{ matrix.shell }} --command vp install --frozen-lockfile --filter @rey/transit-station --filter '@transit/*'
      - name: Run ${{ matrix.lane }} checks
        run: nix develop .#${{ matrix.shell }} --command just ci::${{ matrix.lane }}
      - name: Install browser and host dependencies
        if: matrix.lane == 'experience'
        run: nix develop .#${{ matrix.shell }} --command vp exec --filter @rey/transit-board-web playwright install --with-deps chromium
      - name: Qualify embedded Board in Chromium
        if: matrix.lane == 'experience'
        run: nix develop .#${{ matrix.shell }} --command just ci::browser
      - name: Preserve task timings and completion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-${{ matrix.lane }}-${{ github.run_attempt }}
          path: |
            .cache/ci/*.json
            .cache/verification/*.json
            .cache/verification/model/*.json
            .cache/verification/model/*.log
            .cache/verification/mutations/*.json
            .cache/verification/mutations/*.log
            .cache/verification/transitions/*.json
            .cache/verification/simulation/*.json
            .cache/verification/simulation-mutations/*.json
            .cache/verification/simulation-mutations/*.log
            .cache/verification/resource-simulation/
            .cache/verification/resource-simulation-mutations/
            .cache/verification/scheduler-simulation/
            .cache/verification/scheduler-simulation-mutations/
            .cache/verification/domain-simulation/
            .cache/verification/domain-simulation-mutations/
            .cache/verification/vortex/
            .cache/transit-board-browser/
            .cache/m9/station-local-readiness.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Save Zig standard libraries and fetched packages
        # One writer, including Zig's costly C++ standard library build. Source
        # changes reuse this immutable compiler/dependency cache in every lane.
        if: ${{ !cancelled() && inputs.cache_mode != 'cold' && matrix.lane == 'bindings' && steps.zig-cache.outcome == 'success' && steps.zig-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cache/ci-zig/o
            .cache/ci-zig/h
            .cache/ci-zig/p
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}
  foundation-and-protocol:
    # Preserve the previous required-check name across the decomposition.
    if: always()
    needs: [plan, checks, documentation]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected check
        env:
          PLAN: ${{ needs.plan.result }}
          FULL: ${{ needs.plan.outputs.full }}
          RESULT: ${{ needs.checks.result }}
          DOCS: ${{ needs.documentation.result }}
        run: |
          test "$PLAN" = success
          case "$FULL:$RESULT:$DOCS" in
            true:success:skipped|false:skipped:success) ;;
            *) exit 1 ;;
          esac
