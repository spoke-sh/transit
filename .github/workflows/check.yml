name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation-and-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - run: nix develop --command just check
      - run: nix develop --command just test-packages
      - run: nix develop --command just test-storage
      - run: nix develop --command just test-service
