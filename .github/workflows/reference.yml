name: Reference recovery
on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 0'
permissions:
  contents: read
concurrency:
  group: transit-reference
  cancel-in-progress: false
jobs:
  kubernetes-substrate:
    # Register a dedicated Linux x86_64 runner with Nix, Git, Docker and enough
    # resources for Substrate. This privileged proof runs weekly and on demand;
    # an unavailable dedicated runner leaves qualification outstanding.
    runs-on: [self-hosted, linux, x64, transit-reference]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: nix develop --command just transit-board::install
      - run: nix develop --command just launchers::reference::infra-up
      - run: nix develop --command just launchers::reference::images
      - run: nix develop --command just launchers::reference::test-launcher
      - run: nix develop --command just launchers::reference::test
      - run: nix develop --command just launchers::compose::test
      - run: nix develop --command just launchers::compose::test-station
      - run: nix develop --command just launchers::reference::test-station
      - run: nix develop --command just test::capacity
      - run: nix develop --command just test::growing-capacity
      - run: nix develop --command just test::pages-cold --keys 1024
      - run: nix develop --command just test::scale
      - name: Preserve capacity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-capacity-${{ github.run_attempt }}
          path: |
            .cache/*capacity-evidence.json
            .cache/verification/pages-*.json
            .cache/verification/scale/*.json
          include-hidden-files: true
          retention-days: 14
      - if: always()
        run: |
          if test -f .cache/reference/state.json; then
            nix develop --command just launchers::reference::infra-down
          fi
