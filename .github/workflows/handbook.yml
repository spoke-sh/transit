name: Publish handbook

on:
  # Included component guides, schemas and examples live outside docs/handbook.
  # Build every main revision so publication includes changes to those owners.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRANSIT_DOCS_URL: https://spoke-sh.github.io
  TRANSIT_DOCS_BASE_URL: /transit/

jobs:
  build:
    name: Build publication artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Validate source links
        run: python3 -B tests/runner/docs.py
      - name: Install locked documentation dependencies
        run: nix develop .#docs --command vp install --frozen-lockfile --filter transit --filter @transit/docs
      - name: Check and build
        run: nix develop .#docs --command just transit-docs::check
      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/handbook/dist/
          retention-days: 14

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Finish active uploads; reject old builds and reruns inside this lock.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Reject superseded builds
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::A newer main revision supersedes this artifact; skipping publication'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Pages
        if: steps.current.outputs.publish == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the built artifact
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check public routes
        if: steps.current.outputs.publish == 'true'
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for route in '' reference/interfaces search-index.json specs/sql-session-v1.schema.json; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 \
              "${SITE_URL%/}/$route" --output /dev/null
          done
          printf 'Published %s to %s\n' "$GITHUB_SHA" "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
