name: Build feedback experiments
on:
  workflow_dispatch:
  schedule:
    - cron: '41 7 * * 2'
permissions:
  contents: read
concurrency:
  group: build-feedback-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Reclaim unused hosted SDKs
        run: sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
      - name: Measure isolated edit loops
        run: python3 -B tests/runner/build_feedback.py
      - name: Preserve completed and incomplete measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-feedback-${{ github.run_id }}
          path: .cache/build-feedback/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
