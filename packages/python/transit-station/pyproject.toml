[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-station"
version = "0.2.0"
requires-python = ">=3.13"
description = "Typed Station handlers over the shared Zig implementation"
dependencies = ["transit-client==0.2.0", "transit-native-station==0.2.0"]

[project.optional-dependencies]
arrow = ["pyarrow==23.0.0"]

[tool.setuptools.package-data]
transit_station = ["*-abi.json", "py.typed"]

[tool.mypy]
strict = true
