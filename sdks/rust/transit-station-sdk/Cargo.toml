[package]
name = "transit-station-sdk"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
include = ["src", "README.md", "docs"]

[features]
default = []
arrow = ["dep:arrow-array", "dep:arrow-ipc"]

[dependencies]
arrow-array = { version = "=59.1.0", optional = true, default-features = false }
arrow-ipc = { version = "=59.1.0", optional = true, default-features = false }
libloading = "=0.8.9"
serde = "=1.0.229"
serde_json = { version = "=1.0.145", features = ["arbitrary_precision"] }
transit-client = { version = "=0.0.1", path = "../transit-client" }
transit-native-station = { version = "=0.0.1", path = "../transit-native-station" }
