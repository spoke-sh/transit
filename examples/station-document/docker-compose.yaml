x-runtime: &runtime
  user: '${EXCHANGE_UID:?}:${EXCHANGE_GID:?}'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: "no"
  pids_limit: 256
  mem_limit: 512m
  cpus: 2
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "2"}
services:
  ursula:
    <<: *runtime
    image: '${EXCHANGE_URSULA_IMAGE:?}'
    command: [server, --config, /ursula.toml]
    environment: {RUST_LOG: warn, TOKIO_WORKER_THREADS: "2"}
    volumes:
      - '${EXCHANGE_WORK:?}/ursula.toml:/ursula.toml:ro'
      - '${EXCHANGE_WORK:?}/wal:/wal'
    networks: [storage]
  node:
    <<: *runtime
    image: '${EXCHANGE_NODE_IMAGE:?}'
    command: [/node.json]
    environment: {LOG_LEVEL: warn}
    volumes: ['${EXCHANGE_WORK:?}/operator/node.json:/node.json:ro']
    networks: [storage, client]
  left:
    <<: *runtime
    image: '${EXCHANGE_CALLER_IMAGE:?}'
    command: [/left/config.json]
    volumes:
      - '${EXCHANGE_WORK:?}/left:/left:ro'
      - '${EXCHANGE_WORK:?}/left-activations:/activations'
    networks: [client]
  right:
    <<: *runtime
    image: '${EXCHANGE_CALLER_IMAGE:?}'
    command: [/right/config.json]
    volumes:
      - '${EXCHANGE_WORK:?}/right:/right:ro'
      - '${EXCHANGE_WORK:?}/right-activations:/activations'
    networks: [client]
  writer:
    <<: *runtime
    image: '${EXCHANGE_CONNECTOR_IMAGE:?}'
    command: [/writer/config.json]
    environment: {LOG_LEVEL: warn}
    volumes:
      - '${EXCHANGE_WORK:?}/writer:/writer:ro'
      - '${EXCHANGE_WORK:?}/writer-activations:/activations'
    networks: [client]
  caller-probe:
    <<: *runtime
    image: '${EXCHANGE_PEER_IMAGE:?}'
    networks: [client]
networks:
  storage: {internal: true}
  client: {internal: true}
