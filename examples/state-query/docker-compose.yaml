x-runtime: &runtime
  user: '${EXCHANGE_UID:?}:${EXCHANGE_GID:?}'
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: "no"
  pids_limit: 256
  mem_limit: 512m
  cpus: 2
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "2"}
services:
  ursula:
    <<: *runtime
    image: '${EXCHANGE_URSULA_IMAGE:?}'
    command: [server, --config, /ursula.toml]
    environment: {RUST_LOG: warn, TOKIO_WORKER_THREADS: "2"}
    volumes:
      - '${EXCHANGE_WORK:?}/ursula.toml:/ursula.toml:ro'
      - '${EXCHANGE_WORK:?}/wal:/wal'
    networks: [storage]
  node:
    <<: *runtime
    image: '${EXCHANGE_NODE_IMAGE:?}'
    command: [/node.json]
    environment: {LOG_LEVEL: warn}
    volumes: ['${EXCHANGE_WORK:?}/operator/node.json:/node.json:ro']
    networks: [storage, client]
  source:
    <<: *runtime
    image: '${EXCHANGE_CALLER_IMAGE:?}'
    command: [/source/config.json]
    environment: {LOG_LEVEL: warn}
    volumes:
      - '${EXCHANGE_WORK:?}/source:/source:ro'
      - '${EXCHANGE_WORK:?}/source-data:/runtime-data'
    networks: [client]
  requester:
    <<: *runtime
    image: '${EXCHANGE_CALLER_IMAGE:?}'
    command: [/requester/config.json]
    environment: {LOG_LEVEL: warn}
    volumes:
      - '${EXCHANGE_WORK:?}/requester:/requester:ro'
      - '${EXCHANGE_WORK:?}/requester-data:/runtime-data'
    networks: [client]
  courier:
    <<: *runtime
    image: '${EXCHANGE_CALLER_IMAGE:?}'
    command: [/courier/config.json]
    environment: {LOG_LEVEL: warn}
    volumes:
      - '${EXCHANGE_WORK:?}/courier:/courier:ro'
      - '${EXCHANGE_WORK:?}/courier-data:/runtime-data'
    networks: [client]
  client:
    <<: *runtime
    image: '${EXCHANGE_CONNECTOR_IMAGE:?}'
    command: [/client/config.json]
    environment: {LOG_LEVEL: warn}
    volumes:
      - '${EXCHANGE_WORK:?}/client:/client:ro'
      - '${EXCHANGE_WORK:?}/client-data:/runtime-data'
    networks: [client]
  caller-probe:
    <<: *runtime
    image: '${EXCHANGE_PEER_IMAGE:?}'
    networks: [client]
networks:
  storage: {internal: true}
  client: {internal: true}
