<text x="240" y="845" font-family="sans-serif" font-size="14" font-weight="400" fill="black">White surfaces. Black type. One active underline. Labels beside every meaningful state.</text>
<text x="240" y="869" font-family="sans-serif" font-size="14" font-weight="400" fill="black">The drawings establish hierarchy and interaction; they do not select a theme or prove implementation.</text>
