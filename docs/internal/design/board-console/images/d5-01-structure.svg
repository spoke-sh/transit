<text x="1040" y="545" font-family="sans-serif" font-size="14" font-weight="400" fill="black">Show only recorded stages.</text>
<text x="1040" y="569" font-family="sans-serif" font-size="14" font-weight="400" fill="black">Keep uncertainty in plain language.</text>
