<title id="title">D2 Figure 3 — One query in Form, SQL and Canvas</title><desc id="desc">A shared SELECT draft is represented as form fields, SQL and a typed plan. Explicit Run produces one identified result. Three synthetic matching rows are displayed without a second query.</desc>
