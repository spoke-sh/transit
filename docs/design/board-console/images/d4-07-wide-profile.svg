<svg xmlns="http://www.w3.org/2000/svg" width="352" height="620" viewBox="0 0 352 620" role="img" aria-labelledby="title desc">
<title id="title">D4 — Six dimensions in a compact Profile</title><desc id="desc">Layout-only future wider-result study. Six synthetic rows and six columns, with numeric range shares and categorical frequency shares. Each compact row shows its type, distinct cardinality and null count. This does not claim current wider Table or text-query support.</desc>
