<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">D4 — SQL immediately, clean rows and a right profile panel</title><desc id="desc">FROM sam offers samples at the SQL caret. Six returned rows occupy the main result grid with a compact Preview indicator and Details; the repeated SQL and source/candidate labels are removed. A closable right Profile panel shows both columns with six distinct values and no nulls, id min 101 max 106, value min 8 max 89, and labelled histograms over all six returned rows. Synthetic proposed design, not an implemented UI.</desc>
