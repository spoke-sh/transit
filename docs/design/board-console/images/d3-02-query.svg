<title id="title">D3 — Query and result with more working space</title><desc id="desc">The same compact shell surrounds a SQL editor and a result table. Form, SQL and Canvas are alternatives, with an explicit Run action. The fixture result is complete for three matching rows. Synthetic, proposed interface; not an application screenshot.</desc>
