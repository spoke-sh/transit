<title id="title">D4 — Three returned rows with compact profiles</title><desc id="desc">Three returned rows with compact profiles. Profile owns counts, ordered horizontal bars, distinct/null counts and min/max. Complete opens Query info. Synthetic proposed interface, not implemented behavior. Search Transit is centered in the top navigation; the realm dropdown is at the right. Search uses section context without hiding other sections.</desc>
